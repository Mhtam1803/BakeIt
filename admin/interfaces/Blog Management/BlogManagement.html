    <style>
        /* Remove Thumbnail from Blog Management UI */
        .team-table thead th:first-child,
        #blogBody tr:not(.placeholder-row) > td:first-child {
            display: none !important;
        }

        #blogBody tr.placeholder-row > td {
            display: table-cell !important;
        }

        /* Hide thumbnail upload field in Add/Edit Blog popup */
        #contentModal .form-row:has(.image-upload-box) {
            display: none !important;
        }

        /* Hide thumbnail preview in View Blog popup */
        #contentModal .detail-hero {
            display: none !important;
        }
    </style>
