<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Bake it!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../1.Landing Page/Css/style.css"></head>
<body class="auth-font-sans bg-[#fcf9f6] text-stone-800 antialiased font-sans flex flex-col min-h-screen">

    <div id="global-header-placeholder"></div>

    <div class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-stone-200 rounded-2xl shadow-sm p-6 md:p-8 max-w-md w-full space-y-6">
            
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-[#F4EFE6] text-[#4a3329] rounded-full flex items-center justify-center text-xl mx-auto mb-2">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 id="auth-title" class="text-xl font-bold text-[#4a3329]">Đăng nhập Thành viên</h2>
                <p id="auth-desc" class="text-xs text-stone-400">Vui lòng điền thông tin tài khoản Bake it! của bạn</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-stone-500 block uppercase tracking-wider">Email đăng nhập</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400 text-xs">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="login-email" required placeholder="example@bakeit.com" class="w-full border border-stone-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3329]">
                    </div>
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] font-bold text-stone-500 block uppercase tracking-wider">Mật khẩu</label>
                        <button type="button" id="forgot-password-link" class="text-[10px] font-semibold text-amber-700 hover:underline">Quên mật khẩu?</button>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400 text-xs">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full border border-stone-200 rounded-xl pl-9 pr-10 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3329]">
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 flex items-center pr-3 text-stone-400 hover:text-[#4a3329] transition" aria-label="Hiện mật khẩu" aria-pressed="false">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="remember-me" class="w-3.5 h-3.5 text-amber-700 border-stone-300 rounded focus:ring-amber-500">
                    <label for="remember-me" class="ml-2 text-xs text-stone-500 select-none">Ghi nhớ đăng nhập trên thiết bị này</label>
                </div>

                <div id="login-error-msg" class="text-red-600 text-[11px] text-center font-medium bg-red-50 border border-red-100 p-2 rounded-xl hidden">
                    ❌ Email hoặc mật khẩu không chính xác!
                </div>

                <button type="submit" class="w-full bg-[#4a3329] hover:bg-[#33221a] text-white text-xs font-semibold py-3 rounded-xl transition shadow-sm tracking-wide uppercase">
                    Đăng nhập
                </button>
            </form>

            <form id="register-form" class="space-y-4 hidden">
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-stone-500 block uppercase tracking-wider">Họ và tên</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400 text-xs">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" id="register-fullname" required placeholder="Nguyễn Văn A" class="w-full border border-stone-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3329]">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-stone-500 block uppercase tracking-wider">Email đăng ký</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400 text-xs">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="register-email" required placeholder="example@bakeit.com" class="w-full border border-stone-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3329]">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-stone-500 block uppercase tracking-wider">Số điện thoại</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400 text-xs">
                            <i class="fa-solid fa-phone"></i>
                        </span>
                        <input type="tel" id="register-phone" required placeholder="0900000000" class="w-full border border-stone-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3329]">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-stone-500 block uppercase tracking-wider">Mật khẩu</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400 text-xs">
                            <i class="fa-solid fa-key"></i>
                        </span>
                        <input type="password" id="register-password" required minlength="6" placeholder="Tối thiểu 6 ký tự" class="w-full border border-stone-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3329]">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-stone-500 block uppercase tracking-wider">Nhập lại mật khẩu</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400 text-xs">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="register-confirm-password" required minlength="6" placeholder="Nhập lại mật khẩu" class="w-full border border-stone-200 rounded-xl pl-9 pr-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3329]">
                    </div>
                </div>

                <div id="register-error-msg" class="text-red-600 text-[11px] text-center font-medium bg-red-50 border border-red-100 p-2 rounded-xl hidden"></div>

                <button type="submit" class="w-full bg-[#4a3329] hover:bg-[#33221a] text-white text-xs font-semibold py-3 rounded-xl transition shadow-sm tracking-wide uppercase">
                    Đăng ký
                </button>
            </form>

            <div class="text-center border-t pt-4 text-xs text-stone-500">
                <span id="auth-switch-text">Chưa có tài khoản Bake it!?</span>
                <button type="button" id="toggle-auth-mode" class="text-amber-700 font-bold hover:underline ml-1">Đăng ký thành viên</button>
            </div>

            <div class="text-center text-[12px]">
                <a href="../Personal Info/personal-information.html" class="inline-flex items-center justify-center rounded-xl border border-amber-200 bg-amber-50 px-4 py-2 font-bold text-[#5a2d16] shadow-sm transition hover:bg-amber-100 hover:text-[#3d1e0e]">
                    <i class="fa-solid fa-hand-point-right mr-1.5"></i> Tra cứu đơn hàng không cần đăng nhập tại đây
                </a>
            </div>

        </div>
    </div>

    <div id="global-footer-placeholder"></div>

    <div id="forgot-password-modal" class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/50 px-4">
        <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="text-base font-bold text-[#4a3329]">Đặt lại mật khẩu</h3>
                <button type="button" id="forgot-password-close" class="text-stone-400 transition hover:text-stone-700">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="forgot-password-form" class="mt-4 space-y-4">
                <div>
                    <label class="mb-1 block text-[11px] font-bold uppercase tracking-wider text-stone-500">Email tài khoản</label>
                    <input type="email" id="forgot-email" required placeholder="example@bakeit.com" class="w-full rounded-xl border border-stone-200 px-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3329]">
                </div>
                <div>
                    <label class="mb-1 block text-[11px] font-bold uppercase tracking-wider text-stone-500">Mật khẩu mới</label>
                    <input type="password" id="forgot-new-password" required minlength="6" placeholder="Tối thiểu 6 ký tự" class="w-full rounded-xl border border-stone-200 px-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3329]">
                </div>
                <div>
                    <label class="mb-1 block text-[11px] font-bold uppercase tracking-wider text-stone-500">Nhập lại mật khẩu mới</label>
                    <input type="password" id="forgot-confirm-password" required minlength="6" placeholder="Nhập lại mật khẩu mới" class="w-full rounded-xl border border-stone-200 px-4 py-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-[#4a3329]">
                </div>

                <div id="forgot-password-msg" class="hidden rounded-xl p-2 text-center text-[11px] font-medium"></div>

                <div class="grid grid-cols-2 gap-3 pt-1">
                    <button type="button" id="forgot-password-cancel" class="rounded-xl border border-stone-200 px-4 py-2 text-xs font-semibold text-stone-600 transition hover:bg-stone-50">Hủy</button>
                    <button type="submit" class="rounded-xl bg-[#4a3329] px-4 py-2 text-xs font-semibold text-white transition hover:bg-[#33221a]">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../shared/cart-storage.js"></script>
    <script src="../../shared/global-layout.js"></script>
    <script src="./login.js"></script>
</body>
</html>
