<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cần hỗ trợ - Bake it!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #FFFDF8;
            color: #4A3329;
            font-family: 'Baloo 2', cursive;
        }

        .support-page {
            max-width: 980px;
            margin: 0 auto;
            padding: 56px 24px 72px;
        }

        .support-hero {
            margin-bottom: 28px;
            padding-bottom: 22px;
            border-bottom: 1px solid #E6DEC9;
        }

        .support-hero h1 {
            margin: 0 0 10px;
            color: #5C3D2E;
            font-size: 38px;
            line-height: 1.2;
        }

        .support-hero p {
            margin: 0;
            color: #7A6655;
            font-size: 17px;
            line-height: 1.6;
        }

        .support-content {
            display: grid;
            gap: 22px;
        }

        .support-section {
            background: #FFFFFF;
            border: 1px solid #E6DEC9;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(92, 61, 46, 0.06);
        }

        .support-section h2 {
            margin: 0 0 12px;
            color: #6B442F;
            font-size: 24px;
        }

        .support-section p {
            color: #6E5A4B;
            font-size: 16px;
            line-height: 1.7;
            margin: 0 0 10px;
        }

        .support-form {
            display: grid;
            gap: 16px;
        }

        .support-form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .support-field {
            display: grid;
            gap: 6px;
        }

        .support-field.full {
            grid-column: 1 / -1;
        }

        .support-field label {
            color: #5C3D2E;
            font-weight: 700;
            font-size: 15px;
        }

        .support-field input,
        .support-field select,
        .support-field textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #E1D6BF;
            border-radius: 10px;
            background: #FFFDF8;
            color: #4A3329;
            font-family: inherit;
            font-size: 15px;
            padding: 11px 12px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .support-field textarea {
            min-height: 140px;
            resize: vertical;
        }

        .support-field input:focus,
        .support-field select:focus,
        .support-field textarea:focus {
            border-color: #B9855B;
            box-shadow: 0 0 0 3px rgba(185, 133, 91, 0.16);
        }

        .support-submit-btn {
            justify-self: start;
            border: 0;
            border-radius: 999px;
            background: #7A4E32;
            color: #FFFFFF;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            padding: 12px 22px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .support-submit-btn:hover {
            background: #5C3D2E;
            transform: translateY(-1px);
        }

        .support-submit-btn:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none;
        }

        .support-form-message {
            display: none;
            border-radius: 10px;
            font-weight: 700;
            margin: 0;
            padding: 10px 12px;
        }

        .support-form-message.success {
            display: block;
            background: #EEF9F0;
            color: #28723E;
            border: 1px solid #BFE5C8;
        }

        .support-form-message.error {
            display: block;
            background: #FFF1EE;
            color: #A33D2D;
            border: 1px solid #F0C1B7;
        }

        @media (max-width: 640px) {
            .support-page {
                padding: 36px 16px 56px;
            }

            .support-hero h1 {
                font-size: 30px;
            }

            .support-form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="global-header-placeholder"></div>

    <main class="support-page">
        <section class="support-hero">
            <h1>Cần hỗ trợ</h1>
            <p>Gửi yêu cầu hỗ trợ để Bake it! kiểm tra đơn hàng, đổi trả, hoàn tiền hoặc phản hồi vấn đề bạn đang gặp.</p>
        </section>

        <section class="support-content">
            <article class="support-section">
                <h2>Gửi yêu cầu hỗ trợ</h2>
                <p>Thông tin càng rõ, đội ngũ Bake it! xử lý càng nhanh. Nếu liên quan đến đơn hàng, bạn có thể nhập mã đơn để tụi mình tra cứu dễ hơn.</p>

                <form class="support-form" id="supportRequestForm">
                    <div class="support-form-grid">
                        <div class="support-field">
                            <label for="supportFullName">Họ và tên</label>
                            <input id="supportFullName" name="CustomerName" type="text" required autocomplete="name">
                        </div>
                        <div class="support-field">
                            <label for="supportEmail">Email</label>
                            <input id="supportEmail" name="CustomerEmail" type="email" required autocomplete="email">
                        </div>
                        <div class="support-field">
                            <label for="supportPhone">Số điện thoại</label>
                            <input id="supportPhone" name="CustomerPhone" type="tel" autocomplete="tel">
                        </div>
                        <div class="support-field">
                            <label for="supportOrderId">Mã đơn hàng</label>
                            <input id="supportOrderId" name="OrderID" type="number" min="1" placeholder="Ví dụ: 8001">
                        </div>
                        <div class="support-field full">
                            <label for="supportType">Loại yêu cầu</label>
                            <select id="supportType" name="RequestType">
                                <option value="Support">Hỗ trợ chung</option>
                                <option value="Return">Đổi trả</option>
                                <option value="Refund">Hoàn tiền</option>
                                <option value="Feedback">Góp ý / phản hồi</option>
                            </select>
                        </div>
                        <div class="support-field full">
                            <label for="supportContent">Nội dung cần hỗ trợ</label>
                            <textarea id="supportContent" name="RequestContent" required placeholder="Mô tả vấn đề bạn đang gặp, tình trạng sản phẩm hoặc thông tin cần Bake it! kiểm tra."></textarea>
                        </div>
                    </div>
                    <p class="support-form-message" id="supportFormMessage"></p>
                    <button class="support-submit-btn" id="supportSubmitBtn" type="submit">Gửi yêu cầu hỗ trợ</button>
                </form>
            </article>
        </section>
    </main>

    <div id="global-footer-placeholder"></div>

    <script src="../../shared/cart-storage.js"></script>
    <script src="../../shared/global-layout.js"></script>
    <script>
        (function () {
            const ACCOUNT_KEY = 'bakeit_account';
            const form = document.getElementById('supportRequestForm');
            const message = document.getElementById('supportFormMessage');
            const submitBtn = document.getElementById('supportSubmitBtn');

            function getAccount() {
                try {
                    return JSON.parse(localStorage.getItem(ACCOUNT_KEY) || 'null');
                } catch (error) {
                    return null;
                }
            }

            function showMessage(text, type) {
                message.textContent = text;
                message.className = 'support-form-message ' + type;
            }

            const account = getAccount();
            if (account) {
                document.getElementById('supportFullName').value = account.FullName || '';
                document.getElementById('supportEmail').value = account.Email || '';
                document.getElementById('supportPhone').value = account.Phone || '';
            }

            form.addEventListener('submit', async function (event) {
                event.preventDefault();

                const data = new FormData(form);
                const payload = {
                    CustomerID: account && account.CustomerID,
                    CustomerName: data.get('CustomerName').trim(),
                    CustomerEmail: data.get('CustomerEmail').trim(),
                    CustomerPhone: data.get('CustomerPhone').trim(),
                    OrderID: data.get('OrderID'),
                    RequestType: data.get('RequestType'),
                    RequestContent: data.get('RequestContent').trim()
                };

                if (!payload.CustomerName || !payload.CustomerEmail || !payload.RequestContent) {
                    showMessage('Vui lòng điền đầy đủ họ tên, email và nội dung cần hỗ trợ.', 'error');
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = 'Đang gửi...';

                try {
                    const response = await fetch('/api/support-requests', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const result = await response.json().catch(function () { return {}; });

                    if (!response.ok) {
                        throw new Error(result.message || 'Không thể gửi yêu cầu hỗ trợ.');
                    }

                    form.reset();
                    if (account) {
                        document.getElementById('supportFullName').value = account.FullName || '';
                        document.getElementById('supportEmail').value = account.Email || '';
                        document.getElementById('supportPhone').value = account.Phone || '';
                    }
                    showMessage('Đã gửi yêu cầu hỗ trợ #' + result.RequestID + '. Bake it! sẽ phản hồi trong vòng 1-2 ngày làm việc.', 'success');
                } catch (error) {
                    showMessage(error.message || 'Không thể gửi yêu cầu. Hãy chạy trang bằng server.js.', 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Gửi yêu cầu hỗ trợ';
                }
            });
        })();
    </script>
</body>
</html>
